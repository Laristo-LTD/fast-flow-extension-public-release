name: Build & Release Extension

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run build:extension

      - name: Zip extension
        run: |
          cd dist-extension
          zip -r fastflow-extension.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist-extension/fastflow-extension.zip
